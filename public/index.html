<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paws and Hope | Home</title>


  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">


  <link rel="stylesheet" href="styles.css">

<!--The swiper js-->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>

  <!--Animate.css class-->
  <header> 
    <h1 class="animate__animated animate__bounceInDown">Paws and Hope Animal Rescue</h1>
    <p class="animate__animated animate__fadeIn animate__delay-1s">Browse dog breeds and save your favorites!</p>
  </header>

<!--Nav bar-->
  <nav>
    <a href="/" class="active">Home</a>
    <a href="/about">About</a>
    <a href="/favorites">My Favorites</a>
  </nav>

  <main>

    <p id="welcomeText" class="animate__animated animate__fadeInUp">
      Helping new pet owners explore dog breeds in a simpler, friendlier way.
      Scroll through the highlights, then save the ones you love.
    </p>

    <!--Swiper carousel container-->
    <div class="swiper" id="featuredSwiper">
      <div class="swiper-wrapper" id="swiperWrapper">
      </div>
      <!-- Previous and next arrown buttons -->
      <div class="swiper-pagination"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>

    <h2 style="text-align:center; color: var(--primary);">All Breeds</h2>


    <div id="breedContainer">
      <div class="loader"></div>
    </div>
  </main>



</body>
</html>
